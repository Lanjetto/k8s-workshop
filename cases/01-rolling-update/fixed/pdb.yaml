# PodDisruptionBudget — вторая половина кейса 1.
#
# ВАЖНО, ЧТО PDB НЕ ДЕЛАЕТ: он не имеет никакого отношения к rolling update.
# Обновление Deployment — это добровольное действие самого контроллера, а PDB
# ограничивает ТОЛЬКО добровольные вытеснения (evictions): drain ноды,
# обслуживание, автоскейлер, обновление кластера.
#
# Отсюда классическое заблуждение «я поставил PDB, а поды всё равно
# перезапускаются при выкате». PDB тут ни при чём — он про другое.
# Именно поэтому в кейсе две независимые части: выкат лечится стратегией и
# пробами, а обслуживание нод — PDB.
#
# minAvailable: 2 при replicas: 3 означает: одновременно можно вытеснить
# не больше одного пода. Второй drain упрётся в отказ:
#   Cannot evict pod as it would violate the pod's disruption budget
#
# И это оборотная сторона, о которой надо сказать вслух: PDB может
# ЗАБЛОКИРОВАТЬ обслуживание кластера. Слишком строгий PDB (например,
# minAvailable равный числу реплик) делает drain ноды невозможным навсегда —
# кластер перестаёт обновляться. Баланс между доступностью и ремонтопригодностью
# и есть смысл этого параметра.

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: web
