# СЛОМАННОЕ состояние кейса 1.
#
# Здесь два независимых дефекта, и оба надо найти. Слушателю говорится:
# «сервис теряет запросы во время выката, найди причину». Причин две.
#
# ДЕФЕКТ 1 — maxUnavailable: 100%
#   Все три пода сносятся разом, в течение всего выката в Service ноль
#   живых endpoints. maxSurge: 0 добивает: новых подов заранее не создаётся,
#   перекрытия нет вообще.
#
# ПРИЧИНА, ПО КОТОРОЙ ЭТО НЕ ОЧЕВИДНО:
#   maxUnavailable: 100% выглядит как «разрешить снести до 100%», и многие
#   читают это как «снеси сколько нужно, я разрешаю». На деле это приказ
#   снести всё сразу. Дефолт — 25%, и он безопаснее.
#
# ДЕФЕКТ 2 — нет readinessProbe
#   Приложение спит 15 секунд ПЕРЕД тем как открыть порт. Без readinessProbe
#   kubelet считает контейнер живым сразу после старта, pod попадает в
#   endpoints Service, и трафик льётся в порт, который ещё никто не слушает.
#   Снаружи это connection refused.
#
#   Обрати внимание: если починить только ДЕФЕКТ 1, отказы останутся —
#   просто окно станет короче. Это и есть ловушка кейса: одна правка
#   «почти чинит».

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
      maxSurge: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: busybox:1.37
          # Приложение, которое реально стартует 15 секунд.
          # Без задержки окно отказа было бы ~секунду и кейс не читался бы.
          #
          # index.html создаётся ДО запуска httpd и отдаётся из /www.
          # Это не украшательство: busybox httpd на пустой директории отвечает
          # 404 на «/», и проба, считающая любой неуспешный ответ отказом,
          # будет валить запросы на ЗДОРОВОМ сервисе. Кейс превратится в тыкву.
          command:
            - sh
            - -c
            - |
              mkdir -p /www
              echo ok > /www/index.html
              sleep 15
              exec httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
          # readinessProbe здесь НЕТ — это дефект 2, а не забывчивость

---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
