# ФИКС кейса 2, правило 3 из 3 — вторая половина замка api -> db.
#
# В broken/netpol.yaml у pod'а api УЖЕ ЕСТЬ egress к db. Здесь достраивается
# ingress НА db. Пока этого правила нет, трафик не проходит, хотя разрешение
# в кластере как будто есть.
#
# ЭТО САМАЯ НЕИНТУИТИВНАЯ ЧАСТЬ ВСЕЙ МОДЕЛИ NetworkPolicy, и её стоит
# проговорить медленно. NetworkPolicy — ДВОЙНОЙ ЗАМОК: разрешение нужно с
# обеих сторон соединения, egress у источника И ingress у приёмника. Правило,
# написанное только на одной стороне, не работает и, что хуже, НИЧЕМ СЕБЯ НЕ
# ВЫДАЁТ: объект в кластере есть, `kubectl get netpol` его показывает,
# `describe` не показывает ничего подозрительного.
#
# Проверяется руками (README, раздел 3.2 «half»): применяется весь фикс, но снимается
# ровно это правило. Результат: снаружи всё открылось, а api как не мог
# достучаться до db, так и не может.
#
# ЧЕГО ЗДЕСЬ НЕТ — и это важнее того, что есть. Нет правила, впускающего в db
# откуда-либо ещё. db остаётся недостижимой снаружи, и прибор кейса проверяет
# это отдельно, до и после починки.
#
# Потому что «после починки всё работает» — не критерий. Критерий — «работает
# то, что должно, и не работает то, что не должно». Сетевые политики чаще
# всего ломают именно на второй половине: чинят доступ, добавляя правило
# пошире, и не проверяют, не открылось ли лишнее.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-api
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Здесь podSelector БЕЗ namespaceSelector — и это не упущение.
        # Без namespaceSelector селектор подов означает «поды в ТОМ ЖЕ
        # namespace». Для api и db это верно: они соседи. Если бы db стояла
        # в другом namespace, правило пришлось бы писать парой
        # namespaceSelector + podSelector в одном элементе.
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8080
