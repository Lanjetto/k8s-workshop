# ФИКС кейса 2, правило 1 из 3 — DNS.
#
# Без него не работает ничего, что обращается по имени. Это первая вещь,
# которую надо вспомнить при вводе default-deny, и первая, которую забывают:
# «сеть не работает» в этом случае означает не «нет маршрута», а «нет имён».
# Разные диагнозы, разные починки.
#
# Почему селектор выглядит именно так: k8s сам проставляет каждому namespace
# лейбл `kubernetes.io/metadata.name`, и он равен имени namespace. Заводить
# свои метки для этого не нужно — и это неочевидно, поэтому в реальных
# кластерах такие правила часто пишут через самодельные лейблы, а потом
# полдня ищут, почему не совпадает.
#
# УПРАВЛЯЕМЫЙ КЛАСТЕР: в EKS/GKE/AKS адрес DNS-сервиса другой, но лейбл
# namespace тот же — правило переносится как есть. А вот в кластерах, где
# CoreDNS стоит вне `kube-system`, надо менять имя namespace.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  # Пустой селектор = все поды namespace. DNS нужен всем, поэтому здесь
  # послабление оправдано — но это именно послабление, а не «на всякий
  # случай»: правило разрешает подам только и ровно порт 53.
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        # DNS — редкий случай, когда нужны сразу оба протокола: UDP для
        # обычных запросов и TCP для ответов, не влезших в пакет. Забыть
        # TCP — реальная грабля, которая проявляется не сразу, а только на
        # больших ответах, то есть когда записей в зоне станет много.
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
