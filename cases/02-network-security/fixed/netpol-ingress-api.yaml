# ФИКС кейса 2, правило 2 из 3 — впустить контроллер ingress-nginx.
#
# САМЫЙ НЕОЧЕВИДНЫЙ ДЕФЕКТ КЕЙСА, и он не про безопасность, а про модель.
# ingress-nginx живёт в СВОЁМ namespace. Значит для пода api он такой же
# чужак, как кто угодно из интернета, и default-deny его отсекает наравне со
# всеми. Снаружи это выглядит как «сайт лежит» — при том что и сайт, и
# приложение живы, и об ошибке в кластере нигде не сказано.
#
# Отсюда формулировка для аудитории: «политика не знает слов "доверенная
# сеть". Она знает namespace и лейблы. Контроллер — это просто ещё один чужак,
# и его надо впустить явно.»
#
# ПРО podSelector ПОСЛЕ namespaceSelector (почему его здесь нет).
#
# Записать `namespaceSelector` и `podSelector` В ОДИН элемент `from` — это
# логическое И: «поды с таким лейблом И в таком namespace». Самое точное
# правило — именно такое, с лейблом `app.kubernetes.io/component: controller`.
#
# Здесь его нет намеренно, и вот плата, которую надо назвать вслух: правило
# шире, чем нужно — впускается ВЕСЬ namespace ingress-nginx, а не один под
# контроллера. Причина прозаическая: в том же namespace живёт прибор кейса, и
# это позволяет ему измерять ровно то правило, которое мы написали, стоя
# буквально в положении контроллера.
#
# В проде сузь до лейбла пода. Но тогда вспомни, что любой другой под в
# namespace контроллера (сайдкар, отладка, чей-то временный под) потеряет
# доступ — и это ровно та причина, по которой в ingress-nginx не селятся.
#
# И ОТДЕЛЬНО: разница между «И» и «ИЛИ» здесь — одна строчка YAML. Если
# разнести namespaceSelector и podSelector по РАЗНЫМ элементам списка `from`,
# получится ИЛИ, и allow-ingress-to-api тихо станет «впустить любой под с
# лейблом controller из любого namespace». Стоит показать на разборе.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-api
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        # Порт ПОДА (8080), а не порт Service (80). Политика работает на
        # уровне пода, уже после DNAT от kube-proxy. Указать здесь 80 —
        # классическая ошибка, которая выглядит как «правило есть, а не
        # работает».
        - protocol: TCP
          port: 8080
