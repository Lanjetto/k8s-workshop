# СЛОМАННАЯ политика кейса 2.
#
# История ровно такая, как она выглядит в жизни: «включили сетевую сегментацию
# по требованию безопасников». Кто-то накатил default-deny и успел написать
# ОДНО правило из четырёх. Дальше его отвлекли.
#
#   ✅ default-deny                     — есть, работает
#   ⚠️  allow-api-to-db (ТОЛЬКО egress)  — есть, но половина
#   ❌ allow-dns                         — ОТСУТСТВУЕТ
#   ❌ allow-ingress-to-api              — ОТСУТСТВУЕТ
#
# ДЕФЕКТ 1 — НЕТ РАЗРЕШЕНИЯ НА DNS.
#   Самая частая грабля при вводе default-deny, и самая коварная: DNS-запрос
#   уходит в kube-system, а default-deny закрыл egress целиком. Приложение при
#   этом живо, порт слушает, но любое обращение ПО ИМЕНИ висит и падает.
#   Грабли в том, что «сеть не работает» тут означает не «нет маршрута», а
#   «нет имён» — а это разные диагнозы и лечатся по-разному.
#
# ДЕФЕКТ 2 — НЕТ INGRESS ОТ КОНТРОЛЛЕРА ingress-nginx.
#   Классическое «политика не пускает того, кого я не вижу». ingress-nginx
#   живёт в другом namespace, значит для пода api он такой же чужак, как
#   кто угодно из интернета. Политика про «доверенную сеть» ничего не знает:
#   она видит namespace + лейблы, и без явного правила контроллер отсекается
#   наравне со всеми. Снаружи это выглядит как «сайт лежит», хотя сайт жив.
#
# ДЕФЕКТ 3 — У ПРАВИЛА api -> db ЕСТЬ ТОЛЬКО EGRESS, НЕТ INGRESS НА db.
#   NetworkPolicy — ДВОЙНОЙ ЗАМОК. Разрешение нужно с ОБЕИХ сторон: egress на
#   источнике И ingress на приёмнике. Правило, написанное только на одной
#   стороне, не работает и молчит об этом. Это, пожалуй, самая неинтуитивная
#   вещь во всей модели NetworkPolicy — и почти каждый на ней спотыкается.
#
#   Обрати внимание на порт: в политике указывается ПОРТ ПОДА (8080), а не
#   порт Service (80). Политика работает на уровне пода, после того как
#   kube-proxy уже сделал DNAT. Ещё одна тихая ловушка.
#
# ЛОВУШКА КЕЙСА: снять один дефект и «почти починить». Если разрешить только
# DNS, строка в логе api сменится с «DNS: не резолвится» на «соединение НЕ
# проходит» — то есть отказ останется, но станет ДРУГИМ. Показывается руками:
# см. README, раздел 3.1 «dns».

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  # Пустой podSelector = «все поды namespace». Вместе с policyTypes это и есть
  # default-deny: трафик не запрещается поимённо, он просто перестаёт быть
  # разрешённым, пока его кто-нибудь не разрешит явно.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-db
spec:
  podSelector:
    matchLabels:
      app: api
  # policyTypes: [Egress] — то есть правило описывает ровно одну сторону.
  # Второй половины (ingress на db) нет. Это и есть дефект 3.
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: db
      ports:
        - protocol: TCP
          port: 8080
