# Прибор кейса 2. Живёт в namespace INGRESS-NGINX — то есть СНАРУЖИ case02,
# буквально в том же положении, что и контроллер ingress-nginx.
#
# ПОЧЕМУ ИМЕННО ТАМ. Часть кейса про вход — это история про то, что политика
# не пускает контроллер, потому что он чужак в другом namespace. Чтобы это
# измерить, прибор должен быть чужаком ровно того же сорта. Он тут и есть:
# правило фикса `allow-ingress-to-api` впускает namespace ingress-nginx, и
# прибор попадает под него наравне с контроллером.
#
# Прибор ДВУСТОРОННИЙ, и это его главная особенность:
#
#   api  должен ОТКРЫТЬСЯ       — это вход, его лечим в части 2
#   db   должна ОСТАТЬСЯ ЗАКРЫТОЙ — это внутренний сервис, его не трогаем
#
# Вторая строка — страховка от ленивого фикса «снести политику, тогда всё
# заработает». Проверяется руками — см. README, раздел 3.3 «badfix».
#
# Печатает ПЕРЕХОДЫ состояния, а не каждый замер: строка появляется в момент,
# когда что-то изменилось, — то есть ровно тогда, когда на экране происходит
# починка. Плюс редкий heartbeat, чтобы молчание прибора нельзя было
# перепутать с его смертью.
#
# Задержка между строками 1–5 секунд — не тормоза, а физика. Calico гасит
# заблокированный трафик МОЛЧАНИЕМ (DROP), поэтому каждая неудачная проверка
# сначала ждёт свой таймаут. Отказ по DROP выглядит как зависание, а не как
# быстрая ошибка — и это первое, что отличает сетевое блокирование от
# упавшего приложения.

apiVersion: v1
kind: Pod
metadata:
  name: net-probe
  labels:
    app: net-probe
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          API=http://api.case02.svc.cluster.local/
          DB=http://db.case02.svc.cluster.local/

          echo "net-probe: namespace ingress-nginx -> $API"
          echo "net-probe: измеряю снаружи case02 — в том же положении, что и контроллер"

          # КАЛИБРОВКА ПРИБОРА ДО ЭКСПЕРИМЕНТА.
          #
          # В этом namespace политик нет, поэтому DNS здесь обязан работать.
          # Если он сломан ДАЖЕ ЗДЕСЬ — виноват не кейс, а кластер, и все
          # дальнейшие FAIL'ы будут врать: покажут не то, что мы заложили, а
          # общую поломку стенда. Ровно тот же приём, что самопроверка в
          # кейсе 1: прибор калибруют раньше, чем ему верят.
          if timeout 2 nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1; then
            echo "SELF ok: DNS снаружи case02 живой — прибору можно верить"
          else
            echo "SELF !!! DNS не работает ДАЖЕ ЗДЕСЬ — прибор врёт, кейс невалиден"
          fi

          tick=0
          api_state=""
          db_state=""

          while true; do
            tick=$((tick+1))
            ts=$(date +%H:%M:%S)

            # Вход: то, что лечим. Ожидаемый переход — down -> up.
            if timeout 2 wget -q -O /dev/null --timeout=2 "$API" 2>/dev/null; then
              s=up
            else
              s=down
            fi
            if [ "$s" != "$api_state" ]; then
              api_state=$s
              if [ "$s" = up ]; then
                echo "ok  $ts  вход  api: ДОСТУПЕН"
              else
                echo "!!! $ts  вход  api: НЕДОСТУПЕН (нет ответа)"
              fi
            fi

            # Утечка: то, что обязано остаться закрытым при ЛЮБОМ фиксе.
            if timeout 2 wget -q -O /dev/null --timeout=2 "$DB" 2>/dev/null; then
              s=open
            else
              s=closed
            fi
            if [ "$s" != "$db_state" ]; then
              db_state=$s
              if [ "$s" = open ]; then
                echo "!!! $ts  утечка  db: ДОСТУПНА СНАРУЖИ — политика дырявая"
              else
                echo "ok  $ts  утечка  db: закрыта снаружи — правильно, это внутренний сервис"
              fi
            fi

            if [ $((tick % 10)) -eq 0 ]; then
              echo "... $ts  прибор жив, проверок: $tick"
            fi

            sleep 1
          done
