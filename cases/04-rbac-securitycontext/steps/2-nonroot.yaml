# ШАГ «ПОЧТИ ПОЧИНИЛ» №2 — политика довольна, контейнер запускается,
# приложение падает.
#
# `runAsNonRoot: true` — это ЗАЯВЛЕНИЕ, а не механизм. Оно говорит kubelet:
# «не пускай, если образ хочет стартовать от root». Образ busybox никакого
# USER не объявляет, а значит хочет именно от root — отсюда отказ
# CreateContainerConfigError на предыдущем шаге.
#
# Лечится указанием КОНКРЕТНОГО uid: заявление превращается в факт.
#
# Отличие от steps/1-declared.yaml — ровно две строки (runAsUser/runAsGroup).
# Дальше под стартует и упирается в третий слой — права на том.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: busybox:1.37
          command: ["sh", "/etc/app/run.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          # Проба готовности — и она здесь не для красоты.
          #
          # Файл /www/healthz приложение заводит ТОЛЬКО после того, как
          # убедилось, что умеет писать в свой том. Значит «готов» здесь
          # означает «действительно работает», а не «процесс запустился».
          #
          # Без пробы падающий под успевает побыть Ready доли секунды (у
          # контейнера без пробы готовность наступает сразу после старта), и
          # выкат считает такую замену удачной — убивая старые поды. Кейс
          # после этого разваливается: вместо «сервис работает, а выкат
          # стоит» на экране пустой Deployment.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: script
              mountPath: /etc/app
            - name: www
              mountPath: /www
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-api
        - name: script
          configMap:
            name: app-script
            defaultMode: 0555
        - name: www
          emptyDir: {}
